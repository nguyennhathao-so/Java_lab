<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Danh sách yêu cầu hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>DANH SÁCH DUYỆT HIẾN MÁU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>SDT</th>
                            <th>Giới tính</th>
                            <th>Nhóm máu</th>
                            <th>Đơn vị (ml)</th>
                            <th>Bệnh</th>
                            <th>Hoạt động</th>
                        </tr>
                    </thead>
                    <tbody id="approveTableBody">
                        <!-- Data will be loaded here dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Load "Chờ khám" donations
        async function loadPendingMedicalCheckDonations() {
            const tbody = document.getElementById('approveTableBody');
            try {
                // Bước 1: Gọi API mới để lấy các lượt hiến máu có status 'Chờ khám'
                const donations = await adminApiService.getDonationsByStatus('Chờ khám');
                tbody.innerHTML = ''; // Xóa dữ liệu cũ

                if (donations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Không có lượt hiến máu nào đang chờ khám.</td></tr>';
                    return;
                }

                donations.forEach((donation, index) => {
                    const user = donation.user || {};
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${donation.donationId}</td>
                            <td>${user.name || 'N/A'}</td>
                            <td>${user.phone || 'N/A'}</td>
                            <td>${user.gender || 'N/A'}</td>
                            <td>${user.bloodType || 'N/A'}</td>
                            <td>${donation.amount || 'N/A'}</td>
                            <td>Chưa cập nhật</td>
                            <td class="action-buttons">
                                <button class="delete" onclick="deleteDonation('${donation.donationId}')">Xóa</button>
                                <button class="edit" onclick="editDonation('${donation.donationId}')">Sửa</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Error loading donations for approval:', error);
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Không thể tải dữ liệu.</td></tr>';
            }
        }

        // Bước 3: Điều hướng đến trang Sửa
        function editDonation(donationId) {
            window.location.href = `update.html?id=${donationId}`;
        }

        // Delete donation
        async function deleteDonation(id) {
            if (confirm('Bạn có chắc chắn muốn xóa vĩnh viễn lượt hiến máu này?')) {
                try {
                    await adminApiService.deleteDonation(id);
                    alert('Đã xóa thành công!');
                    loadPendingMedicalCheckDonations(); // Tải lại danh sách
                } catch (error) {
                    console.error('Error deleting donation:', error);
                    alert('Lỗi khi xóa!');
                }
            }
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Tải slide bar
            const slideBar = document.getElementById('slide-bar');
            fetch('../components/slibar_admin.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    slideBar.innerHTML = data;
                })
                .catch(error => console.error('Error loading slide bar:', error));

            loadPendingMedicalCheckDonations();
        });

    </script>
</body>

</html>
