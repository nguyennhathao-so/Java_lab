<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Danh sách yêu cầu hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>DANH SÁCH YÊU CẦU HIẾN MÁU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>SDT</th>
                            <th>Thời Gian</th>
                            <th>Giới tính</th>
                            <th>Nhóm máu</th>
                            <th>Hoạt động</th>
                        </tr>
                    </thead>
                    <tbody id="donationsTableBody">
                        <!-- Data will be loaded here dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Load blood donations data
        async function loadBloodDonations() {
            try {
                const donations = await adminApiService.getBloodDonations();
                const tbody = document.getElementById('donationsTableBody');
                tbody.innerHTML = '';

                donations.forEach((donation, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${donation.donationId}</td>
                        <td>${donation.user ? donation.user.name : 'N/A'}</td>
                        <td>${donation.user ? donation.user.phone : 'N/A'}</td>
                        <td>${donation.date ? new Date(donation.date).toLocaleDateString('vi-VN') : 'N/A'}</td>
                        <td>${donation.user ? donation.user.gender : 'N/A'}</td>
                        <td>${donation.user ? donation.user.bloodType : 'N/A'}</td>
                        <td>
                            <button class="delete" onclick="deleteDonation(${donation.donationId})">Xóa</button>
                            <button class="accept" onclick="approveDonation(${donation.donationId})">Đồng ý</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading blood donations:', error);
                document.getElementById('donationsTableBody').innerHTML = '<tr><td colspan="8">Không thể tải dữ liệu</td></tr>';
            }
        }

        // Delete donation
        async function deleteDonation(id) {
            if (confirm('Bạn có chắc chắn muốn xóa yêu cầu này?')) {
                try {
                    await adminApiService.deleteDonation(id);
                    alert('Đã xóa yêu cầu thành công!');
                    loadBloodDonations(); // Reload data
                } catch (error) {
                    console.error('Error deleting donation:', error);
                    alert('Lỗi khi xóa yêu cầu!');
                }
            }
        }

        // Approve donation
        async function approveDonation(id) {
            try {
                await adminApiService.approveDonation(id);
                alert('Đã đồng ý yêu cầu hiến máu!');
                loadBloodDonations(); // Reload data
            } catch (error) {
                console.error('Error approving donation:', error);
                alert('Lỗi khi duyệt yêu cầu!');
            }
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadBloodDonations);
    </script>
</body>

</html>
