<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Danh sách yêu cầu hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>DANH SÁCH YÊU CẦU HIẾN MÁU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>SDT</th>
                            <th>Thời Gian</th>
                            <th>Giới tính</th>
                            <th>Nhóm máu</th>
                            <th>Hoạt động</th>
                        </tr>
                    </thead>
                    <tbody id="donationsTableBody">
                        <!-- Data will be loaded here dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Hàm này sẽ được gọi khi DOM đã tải xong
        async function loadAndRenderDonations() {
            const tbody = document.querySelector('tbody');
            try {
                // Bước 1: Gọi API để lấy danh sách yêu cầu "Chờ duyệt"
                const allRequests = await adminApiService.getDonationRequestsByStatus('open');

                // Bước 2: Lọc chỉ lấy các yêu cầu HIẾN MÁU (donate)
                const donateRequests = allRequests.filter(req => req.requestType === 'donate');

                if (donateRequests.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Không có yêu cầu hiến máu nào cần duyệt.</td></tr>';
                    return;
                }

                // Bước 3: Xóa nội dung cũ và điền dữ liệu mới, đảm bảo đúng các trường
                tbody.innerHTML = '';
                donateRequests.forEach((req, idx) => {
                    const user = req.user || {};
                    const requestDate = req.createdAt ? new Date(req.createdAt).toLocaleString('vi-VN') : 'N/A';
                    const row = `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${req.requestId}</td>
                            <td>${user.name || 'N/A'}</td>
                            <td>${user.phone || 'N/A'}</td>
                            <td>${requestDate}</td>
                            <td>${user.gender || 'N/A'}</td>
                            <td>${user.bloodType || 'N/A'}</td>
                            <td class="action-buttons">
                                <button class="delete" onclick="deleteRequest(${req.requestId})">Xóa</button>
                                <button class="accept" onclick="approveRequest(${req.requestId})">Đồng ý</button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Không thể tải danh sách yêu cầu hiến máu:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Lỗi tải dữ liệu. Vui lòng thử lại.</td></tr>';
            }
        }

        // Hàm xử lý khi nhấn nút "Đồng ý"
        async function approveRequest(id) {
            if (confirm('Bạn có chắc chắn muốn duyệt yêu cầu này không?')) {
                try {
                    await adminApiService.approveBloodRequest(id);
                    alert('Đã duyệt yêu cầu thành công!');
                    loadAndRenderDonations(); // reload lại bảng
                } catch (error) {
                    alert('Có lỗi xảy ra khi duyệt. Vui lòng thử lại.');
                }
            }
        }

        // Hàm xử lý khi nhấn nút "Xóa"
        async function deleteRequest(id) {
            if (confirm('Bạn có chắc chắn muốn xóa yêu cầu này không?')) {
                try {
                    await adminApiService.deleteBloodRequest(id);
                    alert('Xóa thành công!');
                    loadAndRenderDonations(); // reload lại bảng
                } catch (error) {
                    alert('Có lỗi xảy ra khi xóa. Vui lòng thử lại.');
                }
            }
        }

        // Chạy hàm tải dữ liệu khi trang được tải lần đầu
        document.addEventListener('DOMContentLoaded', loadAndRenderDonations);

        document.addEventListener('DOMContentLoaded', () => {
            // Bước 4: Tải slide bar và dữ liệu chính
            const slideBar = document.getElementById('slide-bar');
            fetch('../components/slibar_admin.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    slideBar.innerHTML = data;
                })
                .catch(error => console.error('Error loading slide bar:', error));
        });
    </script>
</body>

</html>
