<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Danh sách yêu cầu hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>DANH SÁCH YÊU CẦU HIẾN MÁU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>SDT</th>
                            <th>Thời Gian</th>
                            <th>Giới tính</th>
                            <th>Nhóm máu</th>
                            <th>Hoạt động</th>
                        </tr>
                    </thead>
                    <tbody id="donationsTableBody">
                        <!-- Data will be loaded here dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Load "Chờ duyệt" donations data
        async function loadPendingDonations() {
            const tbody = document.getElementById('donationsTableBody');
            try {
                // Bước 1: Gọi API mới để lấy các lượt hiến máu có status 'Chờ duyệt'
                const donations = await adminApiService.getDonationsByStatus('Chờ duyệt');
                tbody.innerHTML = ''; // Clear previous data

                if (donations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Không có yêu cầu hiến máu nào đang chờ.</td></tr>';
                    return;
                }

                // Bước 2: Hiển thị đúng dữ liệu từ object Donation
                donations.forEach((donation, index) => {
                    const user = donation.user || {}; // Đảm bảo user không bị null
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${donation.donationId}</td>
                            <td>${user.name || 'N/A'}</td>
                            <td>${user.phone || 'N/A'}</td>
                            <td>${new Date(donation.date).toLocaleDateString('vi-VN')}</td>
                            <td>${user.gender || 'N/A'}</td>
                            <td>${user.bloodType || 'N/A'}</td>
                            <td class="action-buttons">
                                <button class="delete" onclick="deleteDonation(${donation.donationId})">Xóa</button>
                                <button class="accept" onclick="approveDonation(${donation.donationId})">Đồng ý</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Không thể tải danh sách yêu cầu hiến máu:', error);
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Lỗi tải dữ liệu. Vui lòng thử lại.</td></tr>';
            }
        }

        // Bước 3: Hàm "Đồng ý" sẽ cập nhật status
        async function approveDonation(donationId) {
            if (!confirm(`Bạn có chắc chắn muốn duyệt yêu cầu #${donationId} không? Yêu cầu sẽ được chuyển sang danh sách "Duyệt hiến máu".`)) {
                return;
            }
            try {
                await adminApiService.updateDonationStatus(donationId, 'Chờ khám');
                alert('Yêu cầu đã được duyệt thành công!');
                loadPendingDonations(); // Tải lại danh sách để item vừa duyệt biến mất
            } catch (error) {
                console.error('Lỗi khi duyệt yêu cầu:', error);
                alert('Có lỗi xảy ra khi duyệt yêu cầu.');
            }
        }

        async function deleteDonation(donationId) {
            if (!confirm(`Bạn có chắc chắn muốn XÓA vĩnh viễn yêu cầu #${donationId}?`)) {
                return;
            }
            try {
                await adminApiService.deleteDonation(donationId);
                alert('Đã xóa yêu cầu thành công.');
                loadPendingDonations(); // Tải lại danh sách
            } catch (error) {
                console.error('Lỗi khi xóa yêu cầu:', error);
                alert('Có lỗi xảy ra khi xóa yêu cầu.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Bước 4: Tải slide bar và dữ liệu chính
            const slideBar = document.getElementById('slide-bar');
            fetch('../components/slibar_admin.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    slideBar.innerHTML = data;
                })
                .catch(error => console.error('Error loading slide bar:', error));

            loadPendingDonations();
        });
    </script>
</body>

</html>
