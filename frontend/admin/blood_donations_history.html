<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lịch sử hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>LỊCH SỬ YÊU CẦU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr style="user-select: none;">
                            <th>STT</th>
                            <th>ID</th>
                            <th>Loại yêu cầu</th>
                            <th>Tên (Người hiến/Trung tâm)</th>
                            <th>Email</th>
                            <th>Liên hệ</th>
                            <th>Giới tính</th>
                            <th>Nhóm máu</th>
                            <th>Số lượng (ml)</th>
                            <th>Ngày</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- Data will be loaded here dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Load combined history
        async function loadHistory() {
            try {
                console.log('Loading history...');
                const historyItems = await adminApiService.getHistory();
                console.log('History items:', historyItems);

                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '';

                if (!historyItems || historyItems.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="11" style="text-align: center;">Chưa có lịch sử yêu cầu.</td></tr>';
                    return;
                }

                historyItems.forEach((item, index) => {
                    console.log('Processing item:', item);
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.id || 'N/A'}</td>
                        <td>${item.type || 'N/A'}</td>
                        <td>${item.name || 'N/A'}</td>
                        <td>${item.email || 'N/A'}</td>
                        <td>${item.contact || 'N/A'}</td>
                        <td>${item.gender || 'N/A'}</td>
                        <td>${item.bloodType || 'N/A'}</td>
                        <td>${item.amount || 'N/A'}</td>
                        <td>${item.date ? new Date(item.date).toLocaleDateString('vi-VN') : 'N/A'}</td>
                        <td>${item.status || 'N/A'}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyTableBody').innerHTML =
                    `<tr><td colspan="11" style="color: red;">Lỗi tải dữ liệu: ${error.message}</td></tr>`;
            }
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>

</html>
