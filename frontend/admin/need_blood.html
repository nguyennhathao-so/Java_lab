<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Yêu cầu cần máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style_admin.css" />

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/example.js"></script>
</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>DANH SÁCH YÊU CẦU CẦN MÁU</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px" />
                </div>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr style="user-select: none;">
                            <th>STT</th>
                            <th>ID</th>
                            <th>Tên trung tâm</th>
                            <th>Liên hệ trung tâm</th>
                            <th>Thời gian</th>
                            <th>Nhóm máu</th>
                            <th>Số lượng (ml)</th>
                            <th>Trạng thái</th>
                            <th>Hoạt động</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                        <tr>
                            <td>1</td>
                            <td>9011</td>
                            <td>name 1</td>
                            <td>11116711111</td>
                            <td>29/3/2011</td>
                            <td>A+</td>
                            <td>40</td>
                            <td>Khẩn cấp</td>
                            <td>
                                <button class="delete">Xóa</button>
                                <button class="accept">Đồng ý</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>5455</td>
                            <td>name 2</td>
                            <td>45543543</td>
                            <td>29/3/2011</td>
                            <td>AB+</td>
                            <td>50</td>
                            <td>Không</td>
                            <td>
                                <button class="delete">Xóa</button>
                                <button class="accept">Đồng ý</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script>
        async function loadBloodRequests() {
            try {
                const requests = await adminApiService.getBloodRequests();
                const tbody = document.getElementById('requestsTableBody');
                tbody.innerHTML = '';

                if (requests.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Không có yêu cầu cần máu nào.</td></tr>';
                    return;
                }

                requests.forEach((request, index) => {
                    const center = request.center;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${request.requestId}</td>
                        <td>${center ? center.name : 'N/A'}</td>
                        <td>${center ? center.contactInfo : 'N/A'}</td>
                        <td>${request.createdAt ? new Date(request.createdAt).toLocaleDateString('vi-VN') : 'N/A'}</td>
                        <td>${request.bloodTypeNeeded || 'N/A'}</td>
                        <td>${request.quantity || 'N/A'}</td>
                        <td>${request.urgencyLevel === 'high' ? 'Khẩn cấp' : 'Bình thường'}</td>
                        <td class="action-buttons">
                            <button class="delete" onclick="deleteBloodRequest(${request.requestId})">Xóa</button>
                            <button class="accept" onclick="approveBloodRequest(${request.requestId})">Đồng ý</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading blood requests:', error);
                document.getElementById('requestsTableBody').innerHTML = '<tr><td colspan="9">Không thể tải dữ liệu</td></tr>';
            }
        }

        async function deleteBloodRequest(id) {
            if (confirm(`Bạn có chắc chắn muốn xóa yêu cầu #${id}?`)) {
                try {
                    await adminApiService.deleteBloodRequest(id);
                    alert('Đã xóa yêu cầu thành công.');
                    loadBloodRequests(); // Tải lại danh sách
                } catch (error) {
                    console.error('Lỗi khi xóa yêu cầu:', error);
                    alert('Có lỗi xảy ra khi xóa yêu cầu.');
                }
            }
        }

        async function approveBloodRequest(id) {
            if (confirm(`Bạn có chắc chắn muốn duyệt yêu cầu #${id}? Yêu cầu sẽ được chuyển vào lịch sử.`)) {
                try {
                    await adminApiService.approveBloodRequest(id);
                    alert('Yêu cầu đã được duyệt thành công!');
                    loadBloodRequests(); // Tải lại danh sách
                } catch (error) {
                    console.error('Lỗi khi duyệt yêu cầu:', error);
                    alert('Có lỗi xảy ra khi duyệt yêu cầu.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadBloodRequests);
    </script>
</body>

</html>
