<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cập nhật tình trạng hiến máu</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style_admin.css">

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <!-- Các file js dùng chung sẽ được nạp ở dưới body -->

</head>

<body>
    <div class="container">
        <div id="slide-bar"></div>
        <main class="main-content">
            <header class="header">
                <h1>CẬP NHẬT TÌNH TRẠNG</h1>
                <div class="admin-info" style="display: flex; align-items: center; gap: 10px;">
                    <span>Admin</span>
                    <img src="../assets/images/icon_admin/logout.png" alt="logout" style="width:20px">
                </div>
            </header>
            <section class="content form-section">
                <form>
                    <label for="illness">Ghi chú (bệnh hoặc thông tin khác)</label>
                    <input type="text" id="illness" placeholder="Để trống nếu không có">

                    <label for="amount">Số Lượng Máu Hiến (ml)</label>
                    <input type="number" id="amount" placeholder="Nhập số lượng máu thực tế">

                    <div class="button-group" style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="submit-button" style="flex: 1;">CẬP NHẬT & HOÀN THÀNH</button>
                        <button type="button" id="cancel-button" class="cancel-button"
                            style="flex: 1; background-color: #f44336;">HỦY BỎ</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/admin-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tải slide bar
            const slideBar = document.getElementById('slide-bar');
            fetch('../components/slibar_admin.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(data => {
                    slideBar.innerHTML = data;
                })
                .catch(error => console.error('Error loading slide bar:', error));

            // Lấy ID từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const donationId = urlParams.get('id');

            if (!donationId) {
                alert('Không tìm thấy ID của lượt hiến máu.');
                window.location.href = 'approve.html'; // Quay lại trang trước
                return;
            }

            // Xử lý sự kiện hủy bỏ
            const cancelButton = document.getElementById('cancel-button');
            cancelButton.addEventListener('click', () => {
                if (confirm('Bạn có chắc chắn muốn hủy việc cập nhật này không?')) {
                    // Chỉ quay lại trang duyệt hiến máu, không thay đổi gì cả
                    window.location.href = 'approve.html';
                }
            });

            // Xử lý sự kiện submit form
            const form = document.querySelector('form');
            form.addEventListener('submit', async (event) => {
                event.preventDefault(); // Ngăn form submit theo cách truyền thống

                const illness = document.getElementById('illness').value;
                const amount = document.getElementById('amount').value;

                if (!amount) {
                    alert('Vui lòng nhập số lượng máu hiến.');
                    return;
                }

                const payload = {
                    notes: illness,
                    amount: parseInt(amount, 10)
                };

                try {
                    await adminApiService.completeDonation(donationId, payload);
                    alert('Cập nhật thành công! Lượt hiến máu đã được chuyển vào lịch sử.');
                    window.location.href = 'blood_donations_history.html';
                } catch (error) {
                    console.error('Lỗi khi cập nhật:', error);
                    alert('Có lỗi xảy ra khi cập nhật. Vui lòng thử lại.');
                }
            });

            // Lấy thông tin donation trước
            fetch(`http://localhost:8082/api/admin/donations/${donationId}`, {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('authToken')
                }
            })
                .then(response => response.json())
                .then(donationData => {
                    // Gán số lượng máu
                    document.getElementById('amount').value = donationData.amount || 350;

                    // Lấy userId từ donationData
                    const userId = donationData.user && donationData.user.userId;
                    if (!userId) {
                        document.getElementById('illness').value = "Chưa cập nhật";
                        return;
                    }

                    // Gọi API lấy notes gần nhất
                    fetch(`http://localhost:8082/api/admin/medical-records/last/${userId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('authToken')
                        }
                    })
                        .then(response => {
                            if (response.status === 204) { // No Content
                                document.getElementById('illness').value = "Chưa cập nhật";
                                return null;
                            }
                            return response.json();
                        })
                        .then(medicalData => {
                            if (medicalData && medicalData.notes) {
                                document.getElementById('illness').value = medicalData.notes;
                            } else if (medicalData !== null) {
                                document.getElementById('illness').value = "Chưa cập nhật";
                            }
                        })
                        .catch(() => {
                            document.getElementById('illness').value = "Chưa cập nhật";
                        });
                })
                .catch(() => {
                    document.getElementById('amount').value = 350;
                    document.getElementById('illness').value = "Chưa cập nhật";
                });
        });
    </script>
</body>

</html>
