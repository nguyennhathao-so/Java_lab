<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Danh sách người dùng</title>

    <!-- favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicons/apple-icon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="../assets/favicons/manifest.json" />
    <!-- 'theme-color' is not supported in Firefox, Firefox for Android, Opera -->
    <meta name="theme-color" content="#ffffff" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- css -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style_admin.css" />

    <!-- js -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/component_admin.js"></script>
    <script src="../js/blood_donations_history_admin.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/example.js"></script>
    <script src="../js/admin-api.js"></script>
  </head>

  <body>
    <div class="container">
      <div id="slide-bar"></div>
      <main class="main-content" id="main-content">
        <header class="header">
          <h1>DANH SÁCH NGƯỜI DÙNG</h1>
          <div
            class="admin-info"
            style="display: flex; align-items: center; gap: 10px"
          >
            <span>Admin</span>
            <img
              src="../assets/images/icon_admin/logout.png"
              alt="logout"
              style="width: 20px"
            />
          </div>
        </header>
        <section class="content" id="user-list-section">
          <table>
            <thead>
              <tr>
                <th>STT</th>
                <th>ID</th>
                <th>Tên</th>
                <th>Địa Chỉ</th>
                <th>Email</th>
                <th>SDT</th>
                <th>Giới tính</th>
                <th>Nhóm máu</th>
                <th>Hoạt động</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>9011</td>
                <td>name 1</td>
                <td>1</td>
                <td>@gmail.com</td>
                <td>11116711111</td>
                <td>Nam</td>
                <td>A+</td>
                <td>
                  <button class="btn delete">Xóa</button>
                  <a href="edit_user.html"
                    ><button class="btn edit">Sửa</button></a
                  >
                </td>
              </tr>
              <tr>
                <td>2</td>
                <td>5455</td>
                <td>name 2</td>
                <td>ab 1</td>
                <td>@gmail.com</td>
                <td>45543543</td>
                <td>Nữ</td>
                <td>AB+</td>
                <td>
                  <button class="btn delete">Xóa</button>
                  <button class="btn edit">Sửa</button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
        <section
          class="content"
          id="no-access-section"
          style="display: none; text-align: center; margin-top: 40px"
        >
          <h2 style="color: red">Bạn không có quyền truy cập vào</h2>
        </section>
      </main>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const role = localStorage.getItem("role")?.toUpperCase();
        if (role !== "ADMIN") {
          // Ẩn bảng danh sách, hiện thông báo
          document.getElementById("user-list-section").style.display = "none";
          document.getElementById("no-access-section").style.display = "block";
        }
      });
    </script>
    <script>
    $(document).ready(async function () {
        // Chỉ fetch nếu có bảng user
        if ($('table thead th').first().text().includes('STT')) {
            try {
                const users = await adminApiService.getAllUsers();
                const tbody = $('table tbody');
                tbody.empty();
                users.forEach((user, idx) => {
                    tbody.append(`
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${user.userId}</td>
                            <td>${user.name || ''}</td>
                            <td>${user.address || ''}</td>
                            <td>${user.email || ''}</td>
                            <td>${user.phone || ''}</td>
                            <td>${user.gender || ''}</td>
                            <td>${user.bloodType || ''}</td>
                            <td>
                                <button class="btn delete">Xóa</button>
                                <a href="edit_user.html?id=${user.userId}"><button class="btn edit">Sửa</button></a>
                            </td>
                        </tr>
                    `);
                });
            } catch (e) {
                $('table tbody').html('<tr><td colspan="9" style="color:red;text-align:center;">Không thể tải danh sách người dùng</td></tr>');
            }
        }
    });
    </script>
    <script>
    $(document).on('click', '.btn.delete', async function () {
        const row = $(this).closest('tr');
        const userId = row.find('td').eq(1).text();
        if (confirm('Bạn có chắc chắn muốn xóa user này?')) {
            try {
                await adminApiService.deleteUser(userId);
                // Sau khi xóa thành công, load lại danh sách user
                const users = await adminApiService.getAllUsers();
                const tbody = $('table tbody');
                tbody.empty();
                users.forEach((user, idx) => {
                    tbody.append(`
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${user.userId}</td>
                            <td>${user.name || ''}</td>
                            <td>${user.address || ''}</td>
                            <td>${user.email || ''}</td>
                            <td>${user.phone || ''}</td>
                            <td>${user.gender || ''}</td>
                            <td>${user.bloodType || ''}</td>
                            <td>
                                <button class="btn delete">Xóa</button>
                                <a href="edit_user.html?id=${user.userId}"><button class="btn edit">Sửa</button></a>
                            </td>
                        </tr>
                    `);
                });
                alert('Xóa thành công!');
            } catch (e) {
                alert('Xóa thất bại!');
            }
        }
    });
    </script>
  </body>
</html>
